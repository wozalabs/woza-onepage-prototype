<style>
/* ─────────────────────────────────────────────────────────────
   Woza Labs — Lab

   A workbench, on the same sheet as Atrium: twelve columns, the
   same two colours, the same type. On the left the choices; in
   the middle five objects of five kinds, each drawn in whatever
   language the choices make; along the foot, languages with
   names. Change anything and all five redraw.
   ───────────────────────────────────────────────────────────── */
@font-face{font-family:'Neue Montreal';src:url('fonts/NeueMontreal-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Pinyon Script';src:url('fonts/PinyonScript-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --canvas:#F2F0EB; --ink:#434343;
  --ink-2:rgba(67,67,67,.8); --ink-3:rgba(67,67,67,.6);
  --rule:rgba(67,67,67,.14); --wash:rgba(67,67,67,.05); --wash-2:rgba(67,67,67,.08);
  --dith:none;
  --sans:'Neue Montreal','Helvetica Neue',Helvetica,Arial,sans-serif;
  --script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --m:clamp(14px,2.4vw,40px);
  --pad:clamp(16px,min(1.7vw,3vh),36px);
  --hd:clamp(56px,8vh,78px);
  --ft:clamp(48px,6.6vh,62px);
  --t-body:clamp(14px,min(1.02vw,1.9vh),17px);
  --t-small:calc(var(--t-body) * .9);
  --t-lead:clamp(17px,min(1.3vw,2.4vh),22px);
  --t-name:clamp(22px,min(1.9vw,3.5vh),34px);
  --t-cta:clamp(20px,min(1.7vw,3.1vh),32px);
}
html[data-canvas="dark"]{
  --canvas:#434343; --ink:#F2F0EB;
  --ink-2:rgba(242,240,235,.8); --ink-3:rgba(242,240,235,.6);
  --rule:rgba(242,240,235,.16); --wash:rgba(242,240,235,.06); --wash-2:rgba(242,240,235,.1);
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--canvas);color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%;transition:background-color 300ms ease,color 300ms ease;}
body{margin:0;background:var(--canvas);font-family:var(--sans);font-size:var(--t-body);line-height:1.5;letter-spacing:-.01em;font-weight:400;font-synthesis:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;transition:background-color 300ms ease;}
::selection{background:var(--wash-2);color:var(--ink);}
h1,h2,p,ol,ul,figure{margin:0;padding:0;}
h1,h2{font-weight:400;}
ol,ul{list-style:none;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:2px;}
.skip{position:fixed;left:var(--m);top:8px;z-index:50;padding:.5em .8em;background:var(--ink);color:var(--canvas);border-radius:999px;transform:translateY(-160%);transition:transform 200ms var(--ease-out);}
.skip:focus{transform:none;}

/* ── Type ── */
.sc{font-family:var(--script);font-size:1.28em;line-height:0;letter-spacing:-.01em;padding:0 .05em 0 .07em;font-weight:400;}
.k{color:var(--ink-2);}
.small{font-size:var(--t-small);line-height:1.45;letter-spacing:-.006em;}
.num{font-variant-numeric:tabular-nums;}
.lbl{display:flex;gap:.6em;align-items:baseline;font-size:var(--t-small);line-height:1.3;letter-spacing:-.006em;color:var(--ink-2);}
.lbl b{font-weight:400;color:var(--ink);}
.ttl{font-size:var(--t-name);line-height:1.04;letter-spacing:-.036em;text-wrap:balance;}
.pill{display:inline-flex;align-items:center;gap:.45em;height:2.35em;padding:0 1.05em;border-radius:999px;background:var(--wash);color:var(--ink);font-size:var(--t-small);letter-spacing:-.008em;white-space:nowrap;
  transition:transform 160ms var(--ease-out),background-color 160ms ease;}
.pill:active{transform:scale(.97);}
@media (hover:hover) and (pointer:fine){ .pill:hover,.ver__menu a:hover{background-image:var(--dith);image-rendering:pixelated;} }

/* ── Cells: gapless, spaced from within, ruled top and left ── */
.b{position:relative;min-width:0;min-height:0;padding:var(--pad);display:flex;flex-direction:column;gap:calc(var(--pad) * .7);}
.b::before,.b::after{content:"";position:absolute;left:0;top:0;background:var(--rule);pointer-events:none;z-index:1;}
.b::before{right:0;height:1px;transform-origin:0 50%;}
.b::after{bottom:0;width:1px;transform-origin:50% 0;}
html.js .b::before{transform:scaleX(0);transition:transform 1100ms var(--ease-out) var(--d,0ms);}
html.js .b::after{transform:scaleY(0);transition:transform 1100ms var(--ease-out) var(--d,0ms);}
html.js .b.in::before{transform:scaleX(1);}
html.js .b.in::after{transform:scaleY(1);}
@media (prefers-reduced-motion:reduce){ html.js .b::before,html.js .b::after{transition:none;} }

/* ── Whole-cell actions ── */
.cta{color:var(--ink);background:var(--wash);justify-content:space-between;align-items:flex-start;text-align:left;cursor:pointer;isolation:isolate;transition:color 200ms ease;}
.cta > .fill{position:absolute;inset:0;z-index:0;background:var(--ink);opacity:0;transition:opacity 200ms ease;}
.cta > :not(.fill){position:relative;z-index:2;}
.cta .ctx{font-size:var(--t-small);line-height:1.35;max-width:22em;color:inherit;opacity:.8;}
.cta .go-lbl{display:block;font-size:var(--t-cta);line-height:1.04;letter-spacing:-.032em;max-width:11em;text-wrap:balance;}
.cta .go-lbl > span{display:inline-block;transform-origin:0 100%;transition:transform 160ms var(--ease-out);}
.cta:active .go-lbl > span{transform:scale(.98);}
.cta .arr{position:absolute !important;right:var(--pad);top:var(--pad);width:clamp(18px,1.5vw,26px);height:clamp(18px,1.5vw,26px);transition:transform 220ms var(--ease-out);}
@media (hover:hover) and (pointer:fine){
  .cta:hover{color:var(--canvas);}
  .cta:hover > .fill{opacity:1;}
  .cta:hover .arr{transform:translate(2px,-2px);}
}
.cta:active,.cta:focus-visible{color:var(--canvas);outline:none;}
.cta:active > .fill,.cta:focus-visible > .fill{opacity:1;}

/* ── The top ── */
.top .b{flex-direction:row;align-items:center;padding-top:0;padding-bottom:0;}
.top .b::before{display:none;}
.top .b:first-child::after,.top .tools::after{display:none;}
.logo{display:block;width:clamp(100px,8.6vw,136px);color:var(--ink);}
.logo svg{display:block;width:100%;height:auto;}
.logo .mark__ast{fill:var(--canvas);transition:fill 300ms ease;}
.top .tools{justify-content:flex-end;gap:.5em;}
.top .cta{flex-direction:row;align-items:center;justify-content:space-between;gap:1em;}
.top .cta .go-lbl{font-size:var(--t-body);letter-spacing:-.014em;max-width:none;}
.top .cta .arr{position:relative !important;right:auto;top:auto;width:18px;height:18px;}
.ver{position:relative;}
.ver__menu{position:absolute;right:0;top:calc(100% + 8px);min-width:11em;padding:6px;border-radius:14px;background:var(--canvas);box-shadow:0 0 0 1px var(--rule),0 12px 32px -12px rgba(0,0,0,.28);z-index:40;
  display:grid;transform-origin:top right;opacity:0;transform:scale(.97);visibility:hidden;pointer-events:none;
  transition:opacity 120ms ease,transform 120ms var(--ease-out),visibility 0s linear 120ms;}
.ver.open .ver__menu{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity 180ms ease,transform 200ms var(--ease-out),visibility 0s;}
.ver__menu a{display:block;padding:.5em .8em;border-radius:9px;font-size:var(--t-small);color:var(--ink-2);transition:background-color 120ms ease,color 120ms ease;}
.ver__menu a[aria-current]{color:var(--ink);}
.ver__menu a[aria-current]::after{content:"";display:inline-block;width:.38em;height:.38em;border-radius:50%;background:var(--ink);margin-left:.5em;transform:translateY(-.1em);}
@media (hover:hover) and (pointer:fine){ .ver__menu a:hover{color:var(--ink);} }

/* ── The choices ── */
.panel{gap:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
.panel .intro{display:grid;gap:.7em;padding-bottom:calc(var(--pad) * .4);}
.grp{display:grid;gap:.42em;padding:calc(var(--pad) * .75) 0 calc(var(--pad) * .2);}
.grp + .grp{border-top:1px solid var(--rule);margin-top:calc(var(--pad) * .55);}
.grp > .lbl{margin-bottom:.35em;}
.ctl{display:grid;grid-template-columns:minmax(4.6em,.34fr) minmax(0,1fr);align-items:start;column-gap:.7em;}
.ctl[hidden]{display:none;}
.ctl__k{font-size:var(--t-small);line-height:1.3;color:var(--ink-2);padding-top:.42em;}
.seg{display:flex;flex-wrap:wrap;gap:2px;margin-left:-.55em;}
.seg button{height:1.95em;padding:0 .58em;border-radius:999px;font-size:var(--t-small);color:var(--ink-2);display:inline-flex;align-items:center;gap:.36em;white-space:nowrap;
  transition:background-color 120ms ease,color 120ms ease,transform 160ms var(--ease-out);}
.seg button::before{content:"";width:.34em;height:.34em;border-radius:50%;background:currentColor;transform:scale(0);margin-right:-.7em;transition:transform 200ms var(--ease-out),margin 200ms var(--ease-out);}
.seg button[aria-checked="true"]{background:var(--wash-2);color:var(--ink);}
.seg button[aria-checked="true"]::before{transform:scale(1);margin-right:0;}
.seg button:active{transform:scale(.97);}
@media (hover:hover) and (pointer:fine){ .seg button:hover{background-image:var(--dith);image-rendering:pixelated;color:var(--ink);} }
.sw{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;min-height:1.95em;padding-top:.05em;}
.sw button,.pick{position:relative;width:1.3em;height:1.3em;border-radius:50%;background:var(--sc);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
  transition:transform 160ms var(--ease-out),box-shadow 160ms ease;}
.sw button[aria-checked="true"],.pick.on{box-shadow:0 0 0 2px var(--canvas),0 0 0 3px var(--ink);}
.sw button:active,.pick:active{transform:scale(.92);}
@media (hover:hover) and (pointer:fine){ .sw button:hover,.pick:hover{transform:scale(1.14);} }
.pick{background:conic-gradient(from 90deg,#b0502c,#b68a2c,#56664a,#2f6274,#2e46a3,#7a5c99,#b0502c);cursor:pointer;}
.pick.on{background:var(--sc);}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;}
.pick:focus-within{outline:1.5px solid var(--ink);outline-offset:4px;}
.rng{display:flex;align-items:center;gap:.7em;height:1.95em;}
.rng output{font-size:var(--t-small);font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.4em;text-align:right;}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;height:22px;margin:0;cursor:pointer;}
input[type=range]:focus-visible{outline-offset:2px;}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink-3);}
input[type=range]::-moz-range-track{height:1px;background:var(--ink-3);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink);border:4px solid var(--canvas);box-shadow:0 0 0 1px var(--ink);margin-top:-7px;transition:transform 160ms var(--ease-out);}
input[type=range]::-moz-range-thumb{width:7px;height:7px;border-radius:50%;background:var(--ink);border:4px solid var(--canvas);box-shadow:0 0 0 1px var(--ink);}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15);}
.acts{display:flex;gap:.4em;flex-wrap:wrap;padding-top:calc(var(--pad) * .8);margin-top:calc(var(--pad) * .55);border-top:1px solid var(--rule);}

/* ── The specimens ── */
.spec{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;justify-content:flex-end;}
.spec.drag{cursor:grabbing;}
.spec .art{position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--pad) * 1.6);bottom:calc(var(--pad) * 2.4);pointer-events:none;}
.spec .cap{position:relative;z-index:2;display:flex;gap:.6em;align-items:baseline;font-size:var(--t-small);line-height:1.3;color:var(--ink-2);pointer-events:none;}
.spec .cap > *{background:var(--canvas);padding:.15em .35em;margin:-.15em -.35em;transition:background-color 300ms ease;}
.spec .cap b{font-weight:400;color:var(--ink);}
.spec .cap .num{color:var(--ink-3);}
.spec .hint{position:absolute;right:var(--pad);top:var(--pad);z-index:2;font-size:var(--t-small);color:var(--ink-2);background:var(--canvas);padding:.15em .35em;margin:-.15em -.35em;opacity:0;transition:opacity 260ms ease,background-color 300ms ease;pointer-events:none;}
@media (hover:hover) and (pointer:fine){ .spec:hover .hint{opacity:1;} }
.spec.drag .hint{opacity:0;}
.spec:focus-visible{outline:1.5px solid var(--ink);outline-offset:-4px;}
html.no-gl .spec .art{display:grid;place-items:center;color:var(--ink-3);}
.gl{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none;}
.shuffle .go-lbl{max-width:8.5em;}
.shuffle .ctx{padding-right:2.4em;}

/* ── The languages, along the foot ── */
.now{flex-direction:row !important;align-items:center;gap:.6em !important;padding-top:0 !important;padding-bottom:0 !important;}
.now .nm{font-size:var(--t-lead);letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pre{flex-direction:row;align-items:center;justify-content:flex-start;padding-top:0;padding-bottom:0;gap:.45em;font-size:var(--t-small);color:var(--ink-2);white-space:nowrap;text-align:left;
  transition:color 140ms ease,background-color 140ms ease;}
.pre::before{display:none;}
.pre > i{width:.38em;height:.38em;border-radius:50%;background:var(--ink);flex:none;transform:scale(0);margin-right:-.83em;transition:transform 200ms var(--ease-out),margin 200ms var(--ease-out);}
.pre[aria-pressed="true"]{color:var(--ink);background:var(--wash);}
.pre[aria-pressed="true"] > i{transform:scale(1);margin-right:0;}
.pre:active > span{transform:scale(.97);}
.pre > span{display:inline-block;transition:transform 160ms var(--ease-out);overflow:hidden;text-overflow:ellipsis;}
@media (hover:hover) and (pointer:fine){ .pre:hover{background-image:var(--dith);image-rendering:pixelated;color:var(--ink);} }
.pre:focus-visible{outline-offset:-4px;}
.toast{position:fixed;left:50%;bottom:calc(var(--ft) + 16px);z-index:60;transform:translate(-50%,8px);opacity:0;padding:.55em 1em;border-radius:999px;background:var(--ink);color:var(--canvas);font-size:var(--t-small);pointer-events:none;
  transition:opacity 160ms ease,transform 200ms var(--ease-out);}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── Wide screens: one fixed sheet ── */
@media (min-width:901px) and (min-height:540px) and (orientation:landscape){
  .sheet{position:fixed;top:0;bottom:0;left:var(--m);right:var(--m);display:grid;grid-template-rows:var(--hd) minmax(0,1fr) var(--ft);z-index:1;}
  .sheet::before,.sheet::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--rule);z-index:3;pointer-events:none;}
  .sheet::before{left:0;} .sheet::after{right:0;}
  .top{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-bottom:1px solid var(--rule);position:relative;z-index:4;}
  .top .b{overflow:visible;}
  .top .cta{grid-column:span 3;overflow:clip;}
  .top .b{grid-column:span var(--c,12);}
  .lab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));min-height:0;}
  .panel{grid-column:span 3;min-height:0;}
  .panel::before,.panel::after{display:none;}
  .stage{grid-column:span 9;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));min-height:0;}
  .stage > .b{grid-column:span 3;overflow:hidden;overflow:clip;}
  .stage > .b:nth-child(-n+3)::before{display:none;}
  .stage.focus > .b:not(.on){display:none;}
  .stage.focus > .b.on{grid-column:1 / -1;grid-row:1 / -1;}
  .stage.focus > .b.on::before{display:none;}
  .foot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:1px solid var(--rule);position:relative;z-index:4;}
  .foot .now{grid-column:span 2;}
  .foot .now::after{display:none;}
  .foot .now::before{display:none;}
  .foot .pre{grid-column:span 1;}
}
/* ── Narrow screens: down the page ── */
@media not all and (min-width:901px) and (min-height:540px) and (orientation:landscape){
  .sheet{position:relative;z-index:1;}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 0 0 var(--m);background:var(--canvas);border-bottom:1px solid var(--rule);}
  .top .b{padding:0;}
  .top .b::after{display:none;}
  .top .tools{margin-left:auto;padding-right:10px;}
  .top .cta{align-self:stretch;padding:0 16px;gap:.7em;}
  .lab{display:flex;flex-direction:column-reverse;padding:0 var(--m);}
  .stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));box-shadow:inset 1px 0 0 var(--rule),inset -1px 0 0 var(--rule);}
  .stage > .b{min-height:min(62vw,420px);}
  .stage.focus > .b:not(.on){display:none;}
  .stage.focus > .b.on{grid-column:1 / -1;min-height:min(110vw,640px);}
  .panel{box-shadow:inset 1px 0 0 var(--rule),inset -1px 0 0 var(--rule);}
  .panel::after{display:none;}
  .foot{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 var(--m);box-shadow:inset 1px 0 0 var(--rule),inset -1px 0 0 var(--rule);border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--canvas);z-index:20;height:52px;}
  .foot::-webkit-scrollbar{display:none;}
  .foot .now{display:none;}
  .foot .pre{flex:none;padding:0 16px;}
  .foot .pre::after{display:none;}
  :root{--t-body:16px;--t-name:clamp(24px,6.6vw,32px);--t-cta:clamp(20px,5.6vw,28px);--pad:clamp(16px,4.4vw,26px);}
}
</style>

<script>
/* ─────────────────────────────────────────────────────────────
   The lab's drawing machine.

   The same solids as the site, drawn in two passes. The first
   measures the scene into two buffers: how much shade falls on
   each pixel, where the solid stands, where the ground is in
   shadow, where its marks run, and where the lines run and in
   which direction. The second prints those measurements in a
   chosen language: ordered dots, stipple, halftone, engraving,
   characters, bands or a wash; the lines solid, dashed, dotted,
   sketched, or set in characters too.
   ───────────────────────────────────────────────────────────── */
const Lab = (() => {
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const TAU = Math.PI * 2;

  // ── 3×3 matrices, row by row ──
  const M3 = {
    id: () => [1, 0, 0, 0, 1, 0, 0, 0, 1],
    mul(a, b) { const o = new Array(9); for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c]; return o; },
    v: (m, p) => [m[0] * p[0] + m[1] * p[1] + m[2] * p[2], m[3] * p[0] + m[4] * p[1] + m[5] * p[2], m[6] * p[0] + m[7] * p[1] + m[8] * p[2]],
    rx: a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; },
    ry: a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; },
    rz: a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; },
    s: (x, y = x, z = x) => [x, 0, 0, 0, y, 0, 0, 0, z],
    cols: (a, b, c) => [a[0], b[0], c[0], a[1], b[1], c[1], a[2], b[2], c[2]],
    // the matrix that carries normals: the cofactors, signed so a mirror keeps them pointing out
    nrm(m) {
      const c = [m[4] * m[8] - m[5] * m[7], -(m[3] * m[8] - m[5] * m[6]), m[3] * m[7] - m[4] * m[6],
        -(m[1] * m[8] - m[2] * m[7]), m[0] * m[8] - m[2] * m[6], -(m[0] * m[7] - m[1] * m[6]),
        m[1] * m[5] - m[2] * m[4], -(m[0] * m[5] - m[2] * m[3]), m[0] * m[4] - m[1] * m[3]];
      const det = m[0] * c[0] + m[1] * c[1] + m[2] * c[2];
      return det < 0 ? c.map(v => -v) : c;
    }
  };
  // a frame whose x axis runs along `ex`, with z leaning toward `zh`
  function frame(ex, zh = [0, 0, 1]) {
    const x = norm(ex); let z = sub(zh, scl(x, dot(zh, x)));
    if (len(z) < 1e-6) z = Math.abs(x[1]) < .9 ? cross(x, [0, 1, 0]) : cross(x, [1, 0, 0]);
    z = norm(z); const y = cross(z, x);
    return M3.cols(x, y, z);
  }
  const catmull = (p0, p1, p2, p3, t) => {
    const t2 = t * t, t3 = t2 * t;
    return [0, 1, 2].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3));
  };

  // ── Building: solids and lines, placed through a stack of frames ──
  class Build {
    constructor() { this.P = []; this.N = []; this.F = []; this.L = []; this.st = [{ m: M3.id(), t: [0, 0, 0], c: M3.id() }]; }
    get T() { return this.st[this.st.length - 1]; }
    push(m = M3.id(), t = [0, 0, 0]) {
      const P = this.T, M = M3.mul(P.m, m), o = add(P.t, M3.v(P.m, t));
      this.st.push({ m: M, t: o, c: M3.nrm(M) }); return this;
    }
    at(dx = 0, dy = 0, dz = 0, ry = 0, k = 1) { return this.push(M3.mul(M3.ry(ry), M3.s(k)), [dx, dy, dz]); }
    end() { this.st.pop(); return this; }
    ap(p) { const T = this.T; return add(M3.v(T.m, p), T.t); }
    an(n) { return norm(M3.v(this.T.c, n)); }

    // a triangle, local coordinates; `out` is any vector pointing out of the solid (sets the winding)
    tri(a, b, c, na, nb, nc, out) {
      a = this.ap(a); b = this.ap(b); c = this.ap(c);
      let f = cross(sub(b, a), sub(c, a));
      const l = len(f); if (l < 1e-12) return;
      f = scl(f, 1 / l);
      if (out) { const o = this.an(out); if (dot(f, o) < 0) { f = scl(f, -1); const t = b; b = c; c = t; const u = nb; nb = nc; nc = u; } }
      na = na ? this.an(na) : f; nb = nb ? this.an(nb) : f; nc = nc ? this.an(nc) : f;
      this.P.push(...a, ...b, ...c); this.N.push(...na, ...nb, ...nc); this.F.push(...f);
    }
    quad(a, b, c, d, out, n) {
      const N = n ? (Array.isArray(n[0]) ? n : [n, n, n, n]) : [null, null, null, null];
      this.tri(a, b, c, N[0], N[1], N[2], out); this.tri(a, c, d, N[0], N[2], N[3], out);
    }
    line(a, b) { this.L.push(...this.ap(a), ...this.ap(b)); return this; }
    poly(pts, closed = true) { for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) this.line(pts[i], pts[(i + 1) % pts.length]); return this; }

    box(x0, y0, z0, x1, y1, z1) {
      if (x0 > x1) [x0, x1] = [x1, x0]; if (y0 > y1) [y0, y1] = [y1, y0]; if (z0 > z1) [z0, z1] = [z1, z0];
      const F = (p, o) => this.quad(p[0], p[1], p[2], p[3], o);
      F([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [1, 0, 0]);
      F([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], [-1, 0, 0]);
      F([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], [0, 1, 0]);
      F([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], [0, -1, 0]);
      F([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1]);
      F([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], [0, 0, -1]);
      return this;
    }
    blk(cx, cz, w, d, y0, y1) { return this.box(cx - w / 2, y0, cz - d / 2, cx + w / 2, y1, cz + d / 2); }

    // a solid of revolution about the local vertical; prof: [[r, y], ...]
    lathe(prof, seg, phase = 0, smoothDeg = 38, sweep = TAU) {
      const round = sweep / seg < .55, n2 = [];
      for (let i = 0; i < prof.length - 1; i++) {
        const dr = prof[i + 1][0] - prof[i][0], dy = prof[i + 1][1] - prof[i][1], l = Math.hypot(dr, dy) || 1;
        n2.push([dy / l, -dr / l]);
      }
      const cs = Math.cos(smoothDeg * Math.PI / 180);
      const ends = n2.map((n, i) => {
        const pick = j => { if (j < 0 || j >= n2.length) return n; const m = n2[j]; return (n[0] * m[0] + n[1] * m[1]) > cs ? [n[0] + m[0], n[1] + m[1]] : n; };
        return [pick(i - 1), pick(i + 1)];
      });
      for (let j = 0; j < seg; j++) {
        const a0 = phase + j / seg * sweep, a1 = phase + (j + 1) / seg * sweep, am = (a0 + a1) / 2;
        const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        const ca = round ? [c0, c1] : [Math.cos(am), Math.cos(am)], sa = round ? [s0, s1] : [Math.sin(am), Math.sin(am)];
        for (let i = 0; i < prof.length - 1; i++) {
          const [r0, y0] = prof[i], [r1, y1] = prof[i + 1];
          if (r0 < 1e-9 && r1 < 1e-9) continue;

    const up = e => {

      f.drag = null; n.classList.remove('drag');
      if (!d.moved && e.type === 'pointerup') focusOn(f);
      else if (performance.now() - d.t < 90) f.vaz = clamp(d.v, -6, 6);
      play();
    };
    n.addEventListener('pointerup', up); n.addEventListener('pointercancel', up);
    n.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { f.over = true; play(); } });
    n.addEventListener('pointerleave', () => { f.over = false; play(); });
    n.addEventListener('keydown', e => {
      const a = { ArrowLeft: .2, ArrowRight: -.2 }[e.key], v = { ArrowUp: .1, ArrowDown: -.1 }[e.key];
      if (a) { e.preventDefault(); f.taz = (f.taz ?? f.az) + a; f.tel = f.tel ?? f.el; play(); }
      else if (v && (S.view === 'axo' || S.view === 'persp')) { e.preventDefault(); f.tel = clamp((f.tel ?? f.el) + v, 0, 1.52); f.taz = f.taz ?? f.az; play(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusOn(f); }
    });
  }
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (stage.classList.contains('focus')) { const f = figs.find(g => g.node.classList.contains('on')); if (f) focusOn(f); }
    $('.ver').classList.remove('open'); $('.ver .pill').setAttribute('aria-expanded', 'false');
  });

  // ── The rest of the bench ──
  const toast = $('#toast'); let toastT = 0;
  const say = t => { toast.textContent = t; toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('on'), 1800); };
  $('#copy').addEventListener('click', async () => {
    const q = new URLSearchParams(); for (const k of KEYS) q.set(k, String(S[k]));
    const url = location.href.split('#')[0] + '#' + q.toString();
    const p = PRESETS.find(x => same(x.s, S));
    const text = `Woza Lab — ${p ? p.name : 'Your own'}\n${JSON.stringify(S)}\n${url}`;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.append(t); t.select();
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; } t.remove();
    }
    say(ok ? 'Copied the settings and a link to them' : 'Could not reach the clipboard');
  });
  $('#reset').addEventListener('click', () => apply({ ...PRESETS[0].s, turn: DEF.turn }, true));
  $('#redraw').addEventListener('click', () => { figs.forEach(f => { f.prog = reduce ? 1 : 0; }); play(); });
  const pick = a => a[Math.floor(Math.random() * a.length)];
  $('#shuffle').addEventListener('click', () => {
    const o = k => BY[k].o.map(x => x[0]);
    const s = {
      shade: pick(o('shade').filter(v => v !== 'none').concat(['dither', 'hatch', 'ascii'])), grain: 1 + Math.floor(Math.random() * 4),
      density: Math.round((.45 + Math.random() * .55) * 100) / 100, tone: pick(o('tone')), chars: pick(o('chars')),
      stroke: pick(o('stroke').concat(['solid', 'solid'])), weight: Math.round((.6 + Math.random() * 1.4) * 10) / 10,
      edges: pick(o('edges').concat(['contours'])), hidden: Math.random() < .25, cast: Math.random() < .8,
      sun: Math.floor(Math.random() * 360), height: 22 + Math.floor(Math.random() * 46), ground: pick(['none', 'none', 'grid', 'disc']),
      color: Math.random() < .35 ? pick(BY.color.sw.slice(1).map(x => x[0])) : 'ink',
      fill: pick(['paper', 'paper', 'tint', 'ink', 'clear']), view: pick(['axo', 'axo', 'persp', 'elev']), turn: S.turn, canvas: Math.random() < .25 ? 'dark' : 'light'
    };
    if (s.shade === 'ascii' && Math.random() < .5) s.stroke = 'glyph';
    if (s.stroke === 'none' && (s.fill === 'clear' || s.fill === 'paper' && s.shade === 'none')) s.stroke = 'solid';
    if (s.fill === 'clear') s.edges = 'facets';
    apply(s, true);
  });
  const ver = $('.ver'), vb = $('.ver .pill');
  vb.addEventListener('click', e => { e.stopPropagation(); const o = ver.classList.toggle('open'); vb.setAttribute('aria-expanded', String(o)); });
  document.addEventListener('click', e => { if (!ver.contains(e.target)) { ver.classList.remove('open'); vb.setAttribute('aria-expanded', 'false'); } });

  // ── The frame ──
  let dpr = 1, raf = 0, last = 0, lastDraw = 0, moved = true, spinning = false, built = 0;
  function layout() {
    dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    figs.forEach(f => { f.kw = 0; }); moved = true; play();
  }
  function style() {
    const dark = S.canvas === 'dark', shade = BY.shade.o.map(x => x[0]);
    const mode = { none: 0, dither: 1, stipple: 2, halftone: 3, hatch: 4, ascii: 5, bands: 6, soft: 7 }[S.shade];
    const shA = { none: 0, dither: .64, stipple: .72, halftone: .7, hatch: .82, ascii: .92, bands: .72, soft: .82 }[S.shade];
    return {
      mode, grain: S.grain * dpr, den: S.density, graded: S.tone === 'graded', cast: S.cast, light: sun(),
      ground: { none: 0, grid: 1, disc: 2 }[S.ground], stroke: ['solid', 'dashed', 'dotted', 'sketch', 'glyph', 'none'].indexOf(S.stroke),
      weight: S.weight, edges: ['outline', 'contours', 'facets'].indexOf(S.edges), hidden: S.hidden, fill: ['paper', 'tint', 'ink', 'clear'].indexOf(S.fill),
      bg: dark ? INK : PAPER, ink: dark ? PAPER : INK, shc: S.color === 'ink' ? null : hex(S.color), shA: S.color === 'ink' ? shA * (dark ? .9 : 1) : Math.min(1, shA + .24), dpr, charH: Math.round((5 + S.grain * 3) * dpr), shades: shade
    };
  }
  function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function sun() { const a = S.sun * Math.PI / 180, e = S.height * Math.PI / 180; return [Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)]; }
  function play() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    if (spinning && !moved && now - lastDraw < 31) { play(); return; }
    moved = false; lastDraw = now;
    const dt = Math.min(.05, last ? (now - last) / 1000 : 1 / 60); last = now;
    let busy = false; spinning = false;
    if (!R) return;
    // one figure made each frame, so the page is up before the work is done
    const todo = figs.find(f => !f.fig);
    if (todo) { const m = Specimens[todo.key]; todo.fig = Lab.figure(m.make, { crease: m.crease }); busy = true; }
    const list = [];
    for (const f of figs) {
      if (!f.fig) continue;
      const r = f.node.getBoundingClientRect();
      if (r.width < 4 || r.bottom <= 0 || r.top >= innerHeight || r.right <= 0 || r.left >= innerWidth) continue;
      if (f.prog < 1) { f.prog = Math.min(1, f.prog + dt / 1.7); busy = true; }
      if (camera(f, dt)) busy = true;
      const idle = !reduce && !f.drag && f.tel === null && Math.abs(f.vaz) < 2e-3 && !f.over && S.turn > 0 && f.prog >= 1;
      const want = idle ? 1 : 0;
      f.spin += (want - f.spin) * (1 - Math.exp(-dt * 1.2)); if (Math.abs(want - f.spin) < .002) f.spin = want;
      if (f.spin > 0) { f.az -= f.spin * S.turn * .32 * dt; spinning = true; }
      if (f.spin !== want) busy = true;
      const a = f.art.getBoundingClientRect();
      if (f.kw !== Math.round(a.width) || f.kh !== Math.round(a.height)) { f.kw = Math.round(a.width); f.kh = Math.round(a.height); f.k = R.fit(f.fig, a.width * dpr, a.height * dpr, .9); }
      const cx = r.left + 1, cy = r.top + 1, cw = r.width - 1, ch = r.height - 1;
      const x0 = Math.max(cx, 0), y0 = Math.max(cy, 0), x1 = Math.min(cx + cw, innerWidth), y1 = Math.min(cy + ch, innerHeight);
      const D = v => Math.round(v * dpr);
      list.push({
        fig: f.fig, cell: [D(cx), D(cy), D(cw), D(ch)], art: [D(a.left), D(a.top), D(a.width), D(a.height)], clip: [D(x0), D(y0), D(x1 - x0), D(y1 - y0)],
        az: f.az, el: f.el, k: f.k, persp: S.view === 'persp', prog: f.prog
      });
    }
    R.draw(list, canvas.width, canvas.height, style());
    if (busy) moved = true;
    if (busy || spinning) play(); else last = 0;
  }

  // ── Begin ──
  $$('.top .b, .lab .b, .foot .b').forEach((b, i) => b.style.setProperty('--d', Math.min(i, 12) * 60 + 'ms'));
  requestAnimationFrame(() => $$('.b').forEach(b => b.classList.add('in')));
  sync(); persist();
  addEventListener('resize', layout);
  addEventListener('scroll', () => { moved = true; play(); }, { passive: true });
  if (document.fonts && document.fonts.load) document.fonts.load('400 40px "Neue Montreal"').then(() => cut(S.chars)).catch(() => {});
  layout();
  window.__lab = { get S() { return S; }, apply, figs };
})();

</script>
</body>
